<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151515"><link rel="manifest" href="manifest.webmanifest"><title>Iron Tracker</title><style>*{box-sizing:border-box}body{margin:0;background:#101114;color:#f5f5f5;font:16px system-ui,Arial}main{max-width:650px;margin:auto;padding:20px 16px 60px}h1{margin:0;color:#ff8738;font-size:30px}h2{font-size:20px}.muted{color:#aaa}.panel{background:#1c1e22;border:1px solid #33363c;border-radius:16px;padding:16px;margin:14px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.tabs{display:flex;gap:6px;overflow:auto;margin-top:20px}.tabs button{white-space:nowrap}button,select,input{font:inherit;border-radius:9px;padding:10px;border:1px solid #474747;background:#282a2e;color:white}button{cursor:pointer}button.active,.primary{background:#f47828;border-color:#f47828;color:#111;font-weight:700}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.days button{padding:12px 2px;font-size:13px}.exercise{border-top:1px solid #333;padding:14px 0}.sets{display:grid;grid-template-columns:30px 1fr 1fr 44px;gap:8px;margin-top:8px;align-items:center}.sets input{width:100%;min-width:0}label{font-size:13px;color:#aaa}input[type=checkbox]{width:22px;height:22px;accent-color:#f47828}.wide{width:100%;margin-top:12px} .metric{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric input{width:100%}small{color:#aaa} .bar{height:9px;background:#34363a;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:#f47828}#toast{color:#ffab73;min-height:20px}a{color:#ffab73}textarea{width:100%;min-height:100px;background:#252525;color:white} </style></head><body><main><div class="row"><div><h1>IRON TRACKER</h1><div class="muted">Your private 4-week gym plan</div></div><span style="font-size:36px">🏋️</span></div><div class="tabs"><button id="tab-workout" onclick="tab('workout')">Workouts</button><button id="tab-body" onclick="tab('body')">Body stats</button><button id="tab-history" onclick="tab('history')">Progress</button><button id="tab-data" onclick="tab('data')">Backup</button></div><div id="app"></div><p id="toast"></p></main><script>
const plans=[{day:'Monday',focus:'Chest + thighs',ex:[['Chest Press',3,10],['Leg Press',3,12],['Lat Pulldown',3,12],['Biceps Curl Machine',3,12],['Triceps Extension Machine',3,12],['Seated Calf Raise',3,15]],cardio:'10 min incline walk'},{day:'Tuesday',focus:'Lighter full body',ex:[['Pec Deck',2,15],['Leg Extension',2,15],['Seated Row',3,12],['Preacher Curl Machine',2,15],['Triceps Pushdown Cable',2,15],['Calf Press',3,15]],cardio:'15 min bike'},{day:'Wednesday',focus:'Legs + arms',ex:[['Incline Chest Press',3,10],['Leg Press',3,10],['Seated Leg Curl',3,12],['Lat Pulldown',3,12],['Biceps Curl Machine',3,10],['Triceps Extension Machine',3,10],['Seated Calf Raise',3,15]],cardio:'10 min elliptical'},{day:'Thursday',focus:'Lighter full body',ex:[['Chest Press',2,15],['Leg Extension',2,15],['Seated Row',3,12],['Shoulder Press Machine',2,12],['Preacher Curl Machine',2,15],['Triceps Pushdown Cable',2,15],['Calf Press',2,20]],cardio:'15 min walk'},{day:'Friday',focus:'Chest + arms + legs',ex:[['Chest Press',3,10],['Pec Deck',2,12],['Leg Press',3,12],['Seated Leg Curl',3,12],['Seated Row',3,12],['Biceps Curl Machine',3,12],['Triceps Extension Machine',3,12],['Calf Raise',3,15]],cardio:'10 min bike'}];
const storage='iron-tracker-v1';let state;try{state=JSON.parse(localStorage.getItem(storage))||{}}catch(e){state={}}state.logs??={};state.body??=[];state.custom??={};let week=1,day=0,view='workout';const app=document.getElementById('app');const save=()=>localStorage.setItem(storage,JSON.stringify(state));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const key=()=>`${week}-${day}`;const current=()=>state.custom[key()]||plans[day].ex;function tab(v){view=v;render()}function render(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.id==='tab-'+view));if(view==='workout')workout();else if(view==='body')body();else if(view==='history')history();else dataView()}
function workout(){let done=Object.values(state.logs).filter(x=>x.done).length;let log=state.logs[key()]||{sets:{},done:false};app.innerHTML=`<div class="panel"><div class="row"><b>${done} / 20 workouts completed</b><label>Week <select id="week" onchange="week=+this.value;render()">${[1,2,3,4].map(n=>`<option ${n===week?'selected':''}>${n}</option>`).join('')}</select></label></div><div class="bar" style="margin-top:12px"><span style="width:${Math.min(100,done/20*100)}%"></span></div></div><div class="days">${plans.map((p,i)=>`<button class="${i===day?'active':''}" onclick="day=${i};render()">${p.day.slice(0,3)}${state.logs[week+'-'+i]?.done?' ✓':''}</button>`).join('')}</div><h2>${plans[day].day}: ${plans[day].focus}</h2><small>Record actual weight (lb) and reps for each set. Start with manageable weights.</small><div class="panel">${current().map((ex,i)=>`<div class="exercise"><div class="row"><strong>${esc(ex[0])}</strong><small>${ex[1]} × ${ex[2]} target</small></div><div class="sets"><small>Set</small><label>Weight (lb)</label><label>Reps</label><label>Done</label></div>${Array.from({length:ex[1]},(_,j)=>{let s=log.sets[i+'-'+j]||{};return `<div class="sets"><small>${j+1}</small><input type="number" min="0" step="0.5" placeholder="lb" value="${esc(s.weight??'')}" onchange="updateSet(${i},${j},'weight',this.value)"><input type="number" min="0" step="1" placeholder="${ex[2]}" value="${esc(s.reps??'')}" onchange="updateSet(${i},${j},'reps',this.value)"><input type="checkbox" ${s.checked?'checked':''} onchange="updateSet(${i},${j},'checked',this.checked)"></div>`}).join('')}</div>`).join('')}<div class="exercise"><strong>Cardio: ${plans[day].cardio}</strong><div style="margin-top:10px"><label>Actual cardio minutes <input style="width:110px" type="number" min="0" value="${esc(log.cardio??'')}" onchange="updateLog('cardio',this.value)"></label></div></div><button class="primary wide" onclick="finish()">${log.done?'✓ Completed — tap to undo':'Mark workout complete'}</button></div><div class="panel"><b>Customize this day</b><p class="muted">Add an extra machine to this week's workout.</p><input id="newName" placeholder="Machine name" style="width:100%"><div class="row" style="margin-top:8px"><label>Sets <input id="newSets" type="number" min="1" max="8" value="3" style="width:75px"></label><label>Reps <input id="newReps" type="number" min="1" max="50" value="12" style="width:75px"></label><button onclick="addExercise()">Add</button></div></div>`}
function ensure(){return state.logs[key()]??={sets:{},done:false}}function updateSet(i,j,field,value){let l=ensure(),k=i+'-'+j;l.sets[k]??={};l.sets[k][field]=value;save()}function updateLog(f,v){ensure()[f]=v;save()}function finish(){let l=ensure();l.done=!l.done;l.finished=l.done?new Date().toISOString():null;save();render()}function addExercise(){let name=document.getElementById('newName').value.trim(),sets=+document.getElementById('newSets').value,reps=+document.getElementById('newReps').value;if(!name||sets<1||sets>8||reps<1||reps>50)return alert('Enter a name, 1–8 sets and 1–50 reps.');state.custom[key()]=[...current(),[name,sets,reps]];save();render()}
function body(){app.innerHTML=`<h2>Body measurements</h2><div class="panel"><div class="metric"><label>Weight (lb)<input id="weight" type="number" step="0.1" placeholder="e.g. 320"></label><label>Waist (in)<input id="waist" type="number" step="0.1" placeholder="optional"></label></div><button class="primary wide" onclick="addBody()">Save today's measurement</button></div><h2>Measurement history</h2>${state.body.slice().reverse().map(b=>`<div class="panel row"><span>${esc(b.date)}</span><b>${esc(b.weight)} lb</b><span>${b.waist?esc(b.waist)+' in waist':''}</span></div>`).join('')||'<p class="muted">No measurements yet.</p>'}`}
function addBody(){let weight=document.getElementById('weight').value,waist=document.getElementById('waist').value;if(!weight||+weight<=0)return alert('Enter a valid weight.');state.body.push({date:new Date().toLocaleDateString(),weight:+weight,waist:waist?+waist:null});save();render()}
function history(){let logs=Object.entries(state.logs).filter(([k,l])=>l.done).sort((a,b)=>{let aa=a[0].split('-').map(Number),bb=b[0].split('-').map(Number);return bb[0]-aa[0]||bb[1]-aa[1]});let lift={};for(let [k,l] of Object.entries(state.logs)){let [w,d]=k.split('-').map(Number);if(!plans[d])continue;(state.custom[k]||plans[d].ex).forEach((e,i)=>{for(let j=0;j<e[1];j++){let s=l.sets[i+'-'+j];if(s?.weight&&+s.weight>0){let n=e[0];lift[n]=Math.max(lift[n]||0,+s.weight)}}})}app.innerHTML=`<h2>Workout history</h2><div class="panel"><strong>${logs.length} of 20 completed</strong><p class="muted">Best recorded weights (lb)</p>${Object.entries(lift).sort().map(([n,v])=>`<div class="row" style="padding:5px 0"><span>${esc(n)}</span><b>${v} lb</b></div>`).join('')||'<small>Log your sets to see progress.</small>'}</div>${logs.map(([k,l])=>{let [w,d]=k.split('-').map(Number);return `<div class="panel row"><span>Week ${w} · ${plans[d].day}</span><span>✓ ${l.cardio||0} min cardio</span></div>`}).join('')}`}
function dataView(){app.innerHTML=`<h2>Backup & restore</h2><div class="panel"><p>Your data stays in this browser on this device. Clearing browser site data can erase it, so export backups regularly.</p><button class="primary wide" onclick="exportData()">Download JSON backup</button><p><label>Restore from a previous backup <input type="file" accept="application/json,.json" onchange="importData(this.files[0])"></label></p></div><div class="panel"><b>Privacy</b><p class="muted">No account, tracking, or server database. Workout data is stored locally in your browser.</p></div>`}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='iron-tracker-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(file){if(!file)return;try{let x=JSON.parse(await file.text());if(!x.logs||!Array.isArray(x.body))throw Error();if(confirm('Replace current data with this backup?')){state=x;save();render()}}catch(e){alert('Invalid backup file')}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
